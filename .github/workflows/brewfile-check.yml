name: Brewfile Check

on:
  push:
    paths:
      - "mac/brew/.Brewfile"
  schedule:
    - cron: "0 0 1 */3 *" # 3ヶ月ごと(1,4,7,10月の1日 00:00 UTC)
  workflow_dispatch:

jobs:
  brew-bundle-install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: brew bundle install
        run: brew bundle install --file=mac/brew/.Brewfile
